name: Leaderboard submission
description: Submit a benchmark report for leaderboard consideration.
title: "Leaderboard submission: "
labels:
  - leaderboard
  - triage-ready
  - scoring-review
body:
  - type: input
    id: system_name
    attributes:
      label: System name
      placeholder: MyContradictionDetector
    validations:
      required: true
  - type: input
    id: system_version
    attributes:
      label: System version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: track
    attributes:
      label: Track
      placeholder: contradiction-adversarial
    validations:
      required: true
  - type: input
    id: submission_path
    attributes:
      label: Submission metadata path
      placeholder: submissions/my_system_adversarial.json
    validations:
      required: true
  - type: input
    id: report_path
    attributes:
      label: Report path
      placeholder: baselines/my_system_adversarial.json
    validations:
      required: true
  - type: input
    id: report_sha256
    attributes:
      label: Report SHA-256
      placeholder: 64 hex characters
    validations:
      required: true
  - type: input
    id: bundle_path
    attributes:
      label: Submission bundle path
      placeholder: submissions/my_system_bundle.json
    validations:
      required: true
  - type: input
    id: review_path
    attributes:
      label: Submission review path
      placeholder: submissions/my_system_review.json
    validations:
      required: false
  - type: input
    id: result_card_path
    attributes:
      label: Result card path
      placeholder: submissions/my_system_result_card.json
    validations:
      required: true
  - type: input
    id: evidence_ledger_entry
    attributes:
      label: Third-party evidence ledger entry
      description: Link or path if this submission should also count as external adoption evidence.
      placeholder: adoption/third_party_evidence_ledger_v0_4_0.json
    validations:
      required: false
  - type: textarea
    id: configuration
    attributes:
      label: Configuration
      description: Detector, model, prompt, rules, preprocessing, retrieval, and postprocessing.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation output
      description: Paste output from marked-bench --validate-report REPORT, --validate-submission SUBMISSION, --validate-submission-bundle BUNDLE, --validate-result-card CARD, and --validate-submission-review REVIEW when available.
    validations:
      required: true

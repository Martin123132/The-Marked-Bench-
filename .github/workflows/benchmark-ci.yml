name: Benchmark CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Validate benchmark artifacts
        run: python scripts/validate_benchmark_artifacts.py
      - name: Check standardization status
        run: python -m marked_bench.benchmark_cli --check-standard-status
      - name: Run scoring sanity check
        run: python scripts/check_scoring_sanity.py
      - name: Run case quality check
        run: python scripts/check_case_quality.py
      - name: Run baseline robustness check
        run: python scripts/check_baseline_robustness.py
      - name: Check evaluator walkthrough
        run: python scripts/check_evaluator_walkthrough.py
      - name: Check submission proof
        run: python scripts/check_submission_proof.py
      - name: Check release artifact drift
        run: python scripts/regenerate_release_artifacts.py --check
      - name: Check review workflow
        run: python scripts/check_review_workflow.py
      - name: Check license notices
        run: python scripts/check_license_notice.py

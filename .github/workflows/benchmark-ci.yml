name: Benchmark CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Validate benchmark artifacts
        run: python scripts/validate_benchmark_artifacts.py
      - name: Check standardization status
        run: python -m marked_bench.benchmark_cli --check-standard-status
      - name: Run scoring sanity check
        run: python scripts/check_scoring_sanity.py

name: Validate Marked Bench Result

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  marked-bench-result:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Marked Bench release
        run: python -m pip install git+https://github.com/Martin123132/The-Marked-Bench-.git@v0.4.3
      - name: Validate publication packet
        run: marked-bench --validate-publication-packet marked-bench-result/publication_packet.json
      - name: Validate result claim
        run: marked-bench --validate-result-claim marked-bench-result/result_claim.json
